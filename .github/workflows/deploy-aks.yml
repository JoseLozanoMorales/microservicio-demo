name: Deploy Microservice to Azure AKS (Jeremy)

on:
  push:
    branches: [ "Kuberntes-jeremy" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compilar con Maven
        run: mvn clean package -DskipTests

      - name: Login en Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER_JEREMY }}
          username: ${{ secrets.ACR_USERNAME_JEREMY }}
          password: ${{ secrets.ACR_PASSWORD_JEREMY }}

      - name: Build y Push de la imagen a ACR
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER_JEREMY }}/jeremy-ms:latest .
          docker push ${{ secrets.ACR_LOGIN_SERVER_JEREMY }}/jeremy-ms:latest

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_JEREMY }}

      - name: Configurar contexto de AKS
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP_JEREMY }}
          cluster-name: ${{ secrets.AZURE_CLUSTER_NAME_JEREMY }}

      - name: Desplegar en AKS
        uses: azure/k8s-deploy@v1
        with:
          manifests: |
              k8s/postgres-pvc.yaml
              k8s/postgres-deploy.yaml
              k8s/postgres-service.yaml
              k8s/microservicio-deployment.yaml
              k8s/service.yaml
          images: |
            ${{ secrets.ACR_LOGIN_SERVER_JEREMY }}/jeremy-ms:latest