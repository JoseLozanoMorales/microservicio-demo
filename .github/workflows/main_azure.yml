name: CI/CD Azure Deploy

on:
  push:
    branches:
      - main
      - Rama-Jeremy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      - name: 1. Descargar código
        uses: actions/checkout@v4

      - name: 2. Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 3. Compilar con Maven
        run: mvn clean package -DskipTests

      - name: 4. Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME_JEREMY }}
          password: ${{ secrets.DOCKER_PASSWORD_JEREMY }}

      - name: 5. Construir imagen Docker
        run: docker build -t ${{ secrets.DOCKER_USERNAME_JEREMY }}/jeremy_microservicio .

      - name: 6. Subir imagen a DockerHub
        run: docker push ${{ secrets.DOCKER_USERNAME_JEREMY }}/jeremy_microservicio

      - name: 7. Desplegar en Azure por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_IP_JEREMY }}
          username: jeremy28
          key: ${{ secrets.AZURE_SSH_KEY_JEREMY }}
          script: |
            cd Microservicio_Producto
            docker-compose pull
            docker-compose up -d
