name: Build & Deploy to AKS

on:
  push:
    branches:
      - "Kubernetes-José"

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: grupo4jose.azurecr.io
  IMAGE_NAME: micro-productos
  DEPLOYMENT_NAME: micro-productos
  CONTAINER_NAME: micro-productos
  NAMESPACE: default

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build JAR
        run: |
          chmod +x mvnw
          ./mvnw -B clean package -DskipTests

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Docker login to ACR
        run: |
          az acr login --name grupo4jose

      - name: Build & push image
        run: |
          TAG=${GITHUB_SHA}
          docker build -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$TAG -t $ACR_LOGIN_SERVER/$IMAGE_NAME:latest .
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:$TAG
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:latest

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AZURE_CLUSTER_NAME }}

      - name: Deploy
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/$DEPLOYMENT_NAME $CONTAINER_NAME=$ACR_LOGIN_SERVER/$IMAGE_NAME:${GITHUB_SHA} -n $NAMESPACE
          kubectl rollout status deployment/$DEPLOYMENT_NAME -n $NAMESPACE
          kubectl get pods -n $NAMESPACE
          kubectl get svc -n $NAMESPACE